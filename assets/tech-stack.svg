  <text x="72" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d1d9">Rate limiting · encryption · Cloudflare R2 · Docker</text>

  <rect x="620" y="324" width="536" height="190" rx="18" fill="#111820" stroke="#30363d"/>
